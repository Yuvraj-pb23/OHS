name: Unified CI/CD Pipeline

on:
  push:
    branches: [ "main", "k8s" ]
  pull_request:
    branches: [ "main", "k8s" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ---------------------------------------------------------
  # 1. Lint, Format & Test
  # ---------------------------------------------------------
  test:
    name: Lint, Static Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 shared-mime-info libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit safety -r requirements.txt

      - name: Check Formatting (Black)
        run: black --check . --exclude "venv/|hanuai_venv/|myenv/|posh_view\.py|corp_view\.py"

      - name: Lint Code (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,hanuai_venv,myenv,posh_view.py,corp_view.py

      - name: Security Check (Bandit)
        run: bandit -r . -x ./venv,./hanuai_venv,./myenv,./posh_view.py,./corp_view.py -ll

      - name: Run Django Tests
        run: python manage.py test --noinput

  # ---------------------------------------------------------
  # 2. SAST Scan (Semgrep & Trivy)
  # ---------------------------------------------------------
  sast-scan:
    name: SAST Scan (Semgrep & Trivy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------
  # 3. DAST Scan (OWASP ZAP)
  # ---------------------------------------------------------
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 shared-mime-info libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Environment Variables
        run: |
          echo "DEBUG=True" >> $GITHUB_ENV
          echo "SECRET_KEY=django-insecure-test-key-for-dast-scanning" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=127.0.0.1,localhost" >> $GITHUB_ENV

      - name: Run Database Migrations
        run: |
          python manage.py migrate --noinput

      - name: Start Django Server
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          # Wait for the server to be up and responsive
          for i in {1..15}; do
            curl -s http://127.0.0.1:8000/ && break || sleep 3
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8000/'
          allow_issue_writing: false
          fail_action: false

  # ---------------------------------------------------------
  # 4. Build and Push Docker Image
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push Production Image
    needs: [sast-scan, dast-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/yuvraj-pb23/ohs:latest
            ghcr.io/yuvraj-pb23/ohs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 5. Deploy to VM
  # ---------------------------------------------------------
  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute Remote Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "bash /app/OHS/scripts/deploy.sh"
