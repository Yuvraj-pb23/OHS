name: Continuous Integration

on:
  push:
    branches: ["main", "release/*", "k8s"]
  pull_request:
    branches: ["main", "k8s"]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: Lint, Static Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for Weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 shared-mime-info libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit safety -r requirements.txt

      - name: Check Formatting (Black)
        run: black --check . --exclude "venv/|hanuai_venv/|myenv/|posh_view\.py|corp_view\.py"

      - name: Lint Code (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,hanuai_venv,myenv,posh_view.py,corp_view.py

      - name: Security Check (Bandit)
        run: bandit -r . -x ./venv,./hanuai_venv,./myenv,./posh_view.py,./corp_view.py -ll

      - name: Run Django Tests
        run: python manage.py test --noinput
