services:
  db:
    image: postgres:16-alpine
    container_name: ohs_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod
      - dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ohs_db}
      POSTGRES_USER: ${POSTGRES_USER:-ohs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohs_secure_pass}
    networks:
      - db-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ohs_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod
      - dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass} --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - db-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # Web: The ONLY container that runs migrations and collectstatic
  # =========================================================================
  web:
    image: ghcr.io/yuvraj-pb23/ohs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ohs_web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - sqlite_data:/app/data
    environment:
      - CONTAINER_ROLE=web
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-change-me-1234567890}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,20.244.46.159}
      - DATABASE_URL=postgres://${POSTGRES_USER:-ohs_user}:${POSTGRES_PASSWORD:-ohs_secure_pass}@db:5432/${POSTGRES_DB:-ohs_db}
      - DATABASE_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-info@openhandsolution.com}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
      - db-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =========================================================================
  # Nginx: Reverse proxy — depends on web being healthy
  # =========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ohs_nginx
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

  # =========================================================================
  # Worker: Celery worker — NO migrations, NO collectstatic
  # =========================================================================
  worker:
    image: ghcr.io/yuvraj-pb23/ohs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ohs_worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod
    volumes:
      - media_data:/app/media
      - sqlite_data:/app/data
    environment:
      - CONTAINER_ROLE=worker
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-change-me-1234567890}
      - DATABASE_URL=postgres://${POSTGRES_USER:-ohs_user}:${POSTGRES_PASSWORD:-ohs_secure_pass}@db:5432/${POSTGRES_DB:-ohs_db}
      - DATABASE_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
      - db-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A OHS inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  # =========================================================================
  # Scheduler: Celery beat — NO migrations, NO collectstatic
  # =========================================================================
  scheduler:
    image: ghcr.io/yuvraj-pb23/ohs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ohs_scheduler
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod
    volumes:
      - sqlite_data:/app/data
    environment:
      - CONTAINER_ROLE=beat
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-change-me-1234567890}
      - DATABASE_URL=postgres://${POSTGRES_USER:-ohs_user}:${POSTGRES_PASSWORD:-ohs_secure_pass}@db:5432/${POSTGRES_DB:-ohs_db}
      - DATABASE_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  sqlite_data:
    driver: local

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
