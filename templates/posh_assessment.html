{% extends "base.html" %}
{% load static %}
{% block body %}

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #6200ea;
        --primary-light: #ede7f6;
        --primary-hover: #5a00d6;
        --bg-body: #f8f9fa;
        --surface: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --radius: 16px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-body);
        margin: 0;
        color: var(--text-main);
    }

    .lms-container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* Sidebar */
    .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border-color);
        padding: 25px;
        height: 100vh;
        position: sticky;
        top: 0;
    }

    .nav-item {
        display: flex;
        align-items: center;
        padding: 14px 18px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 500;
        margin-bottom: 8px;
    }

    .nav-item.active {
        background-color: var(--primary);
        color: white;
    }

    /* Main Content */
    .main-content {
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .quiz-card {
        background: var(--surface);
        max-width: 850px;
        width: 100%;
        padding: 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
        position: relative;
    }

    /* Timer Style */
    .timer-badge {
        position: absolute;
        top: 25px;
        right: 40px;
        background: var(--bg-body);
        padding: 8px 15px;
        border-radius: 30px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--border-color);
        min-width: 80px;
        justify-content: center;
    }

    .timer-low {
        color: var(--danger);
        border-color: var(--danger);
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% {
            opacity: 1;
        }

        50% {
            opacity: 0.5;
        }

        100% {
            opacity: 1;
        }
    }

    .progress-container {
        width: 100%;
        background-color: #e5e7eb;
        border-radius: 10px;
        height: 8px;
        margin-bottom: 30px;
    }

    .progress-bar {
        height: 100%;
        background-color: var(--primary);
        border-radius: 10px;
        transition: width 0.3s ease;
    }

    .options-grid {
        display: grid;
        gap: 12px;
        margin-top: 20px;
    }

    .option-card {
        padding: 15px 20px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 500;
    }

    .option-card:hover {
        border-color: var(--primary);
        background-color: var(--primary-light);
    }

    .option-card.selected {
        border-color: var(--primary);
        background-color: var(--primary);
        color: white;
    }

    /* Review Styles */
    .review-section {
        margin-top: 40px;
        width: 100%;
        display: none;
    }

    .review-item {
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 15px;
        background: white;
    }

    .review-item.correct-border {
        border-left: 6px solid var(--success);
    }

    .review-item.wrong-border {
        border-left: 6px solid var(--danger);
    }

    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .bg-success-light {
        background: #d1fae5;
        color: #065f46;
    }

    .bg-danger-light {
        background: #fee2e2;
        color: #991b1b;
    }

    .bg-warning-light {
        background: #fef3c7;
        color: #92400e;
    }

    .btn {
        padding: 12px 30px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-primary {
        background: var(--primary);
        color: white;
    }

    .btn-outline {
        border: 2px solid var(--primary);
        color: var(--primary);
        background: transparent;
    }

    @media (max-width: 1024px) {
        .lms-container {
            grid-template-columns: 1fr;
        }

        .sidebar {
            display: none;
        }
    }
</style>

<div class="lms-container">
    <aside class="sidebar">
        <div class="sidebar-brand" style="margin-bottom: 40px;">
            <h2 style="color:var(--primary); margin:0;">POSH Act</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Final Assessment</p>
        </div>
        <nav>
            <a href="#" class="nav-item active">📝 Final Test</a>
            <a href="javascript:history.back()" class="nav-item">⬅ Exit</a>
        </nav>
    </aside>

    <main class="main-content">
        <!-- Quiz UI -->
        <div class="quiz-card" id="quiz-ui">
            <!-- Timer Badge -->
            <div id="timer-box" class="timer-badge">
                ⏱ <span id="timer-seconds">30</span>s
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span id="q-counter"
                style="color:var(--primary); font-weight:700; text-transform:uppercase; font-size:0.8rem;"></span>
            <h2 id="question-text" style="margin-top:10px; padding-right: 100px;"></h2>
            <div class="options-grid" id="options-container"></div>
            <div style="margin-top:30px; display:flex; justify-content:flex-end;">
                <button class="btn btn-primary" id="next-btn" disabled onclick="handleNext()">Next Question</button>
            </div>
        </div>

        <!-- Results UI -->
        <div class="quiz-card" id="results-ui" style="display:none; text-align:center;">
            <h1>Results</h1>
            <div style="font-size:3.5rem; font-weight:800; color:var(--primary); margin:20px 0;" id="score-display">0/20
            </div>
            <p id="result-message" style="font-size: 1.1rem; margin-bottom: 30px;"></p>
            <div style="display:flex; gap:15px; justify-content:center;">
                <button class="btn btn-primary" onclick="location.reload()">Retry Test</button>
                <button class="btn btn-outline" onclick="generateReview()">Review Answers</button>
            </div>
        </div>

        <!-- Review UI -->
        <div class="review-section" id="review-ui">
            <h2 style="margin-bottom:20px;">Review Answers</h2>
            <div id="review-container"></div>
            <button class="btn btn-primary" style="margin-top:20px; width:100%;" onclick="location.reload()">Close
                Review</button>
        </div>
    </main>
</div>

<script>
    function getCsrfToken() {
        return '{{ csrf_token }}';
    }

    const questionPool = [
        { q: "What does POSH stand for?", a: ["Prevention of Social Harassment Act", "Prevention of Sexual Harassment Act", "Protection of Sexual Harassment Act", "Policy on Safety and Harassment Act"], c: 1 },
        { q: "In which year was the POSH Act enacted in India?", a: ["2010", "2012", "2013", "2015"], c: 2 },
        { q: "What is considered sexual harassment under the POSH Act?", a: ["Only physical contact of a sexual nature", "Only verbal abuse of a sexual nature", "Only non-verbal conduct of a sexual nature", "All of the above"], c: 2 },
        { q: "Which of the following is an example of sexual harassment?", a: ["Asking about work deadlines", "Making sexually coloured remarks", "Assigning tasks", "Giving performance feedback"], c: 1 },
        { q: "What is the name of the committee formed at the workplace under POSH?", a: ["Safety Committee", "Internal Committee", "Ethics Committee", "HR Committee"], c: 1 },
        { q: "POSH Act is mandatory for organizations with how many employees?", a: ["5 or more", "10 or more", "15 or more", "20 or more"], c: 1 },
        { q: "What is the time limit to file a complaint under POSH?", a: ["1 month", "3 months", "6 months", "1 year"], c: 1 },
        { q: "Is a verbal complaint valid under POSH?", a: ["No, only written complaints are accepted", "IC can assist in writing it down", "Only email complaints are valid", "All of the above"], c: 1 },
        { q: "Who can file a complaint under POSH?", a: ["Only female employees", "Only permanent staff", "Any aggrieved employee, including interns or visitors", "Only manager"], c: 2 },
        { q: "Can men file complaints under POSH to the IC?", a: ["Yes", "No", "Only if approved by HR", "Only in government offices"], c: 1 },
        { q: "What is the role of the Internal Committee (IC)?", a: ["Punish employees directly", "Conduct inquiry and recommend action", "File FIR automatically", "Terminate employees"], c: 1 },
        { q: "What is the timeline for completing an inquiry under POSH?", a: ["30 days", "60 days", "90 days", "120 days"], c: 2 },
        { q: "What type of workplace is covered under POSH?", a: ["Only offices", "Only government workplaces", "All workplaces including virtual/work-from-home", "Only factories"], c: 2 },
        { q: "Does repeatedly sending personal, suggestive messages after the employee ignores them considered sexual harassment?", a: ["No, it’s just friendly chatting.", "Yes, if the messages are unwanted and persistent.", "Only if they contain explicit words.", "No, messages are outside the POSH Act’s scope."], c: 1 },
        { q: "Under the POSH Act, can harassment come from a colleague at the same level?", a: ["Only from managers or seniors.", "Yes, harassment can come from any colleague, regardless of position.", "Only from people outside the company.", "It cannot happen between peers."], c: 1 },
        { q: "True or False: Unwanted messages must be clearly sexual to be harassment.", a: ["True", "False – any unwelcome, suggestive, or boundary‑crossing communication that causes discomfort can be harassment.", "Only messages with emojis count.", "Only messages sent after office hours count."], c: 1 },
        { q: "Can online harassment count as sexual harassment under POSH?", a: ["No, POSH only covers physical behaviour.", "Only if the post is personal and unrelated to work.", "Only if it happens on public social media.", "Yes, harassment can be verbal or non‑verbal, online or offline."], c: 3 },
        { q: "True or False: If the comments are “just compliments,” they cannot be harassment.", a: ["True", "False – if the comments are unwelcome and make the person uncomfortable, they can still be harassment.", "Only when they are repeated 10 times.", "Only when they are sent by a senior."], c: 1 },
        { q: "What is the most relevant factor in assessing non-verbal conduct?", a: ["Whether others noticed it", "Whether it was intentional", "Whether it created discomfort or unease", "Whether it was reported immediately"], c: 2 },
        { q: "True or False: If a relationship was consensual, anything shared later is acceptable.", a: ["True", "False – consent to a relationship does not mean consent to share private details at work.", "Only true if they dated for a long time.", "Only true if they were married."], c: 1 },
        { q: "When someone responds to concerns by saying, “Don’t be so serious, it’s just a joke,” what issue does this raise?", a: ["Lack of humor in the team", "Miscommunication between colleagues", "Dismissing the impact of the behavior", "Differences in personality"], c: 2 },
        { q: "Which factor is most important in determining whether such remarks are inappropriate?", a: ["The intention behind the comment", "The seniority of the person speaking", "The effect on the work environment", "Whether the comment was repeated"], c: 2 },
        { q: "A manager suggests discussing career growth outside work in a personal setting. What makes this situation problematic?", a: ["The discussion is informal", "The timing is outside office hours", "As It mixes professional decisions with personal interaction", "The employee has not responded yet"], c: 2 },
        { q: "Which element is most critical in identifying quid pro quo harassment?", a: ["Whether the employee agreed", "Whether the request was explicit", "The connection between benefit and personal expectation", "The location of the interaction"], c: 2 },
        { q: "If an employee feels pressured but no direct demand is stated, how should the situation be viewed?", a: ["As a misunderstanding", "As acceptable unless proven otherwise", "As potentially coercive", "As normal managerial behavior"], c: 2 },
        { q: "Is it the victim’s responsibility to avoid interacting with the harasser?", a: ["No, the organisation must take action to make the workplace safe.", "Yes, the victim should change their own behaviour.", "Only if the victim is junior.", "Only if the manager apologises."], c: 0 }
    ];

    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let userSelections = [];
    let timer;
    let timeLeft = 30;

    function initQuiz() {
        // Use all 26 questions
        activeQuestions = [...questionPool].sort(() => 0.5 - Math.random());
        loadQuestion();
    }

    function startTimer() {
        timeLeft = 30;
        document.getElementById('timer-seconds').innerText = timeLeft;
        document.getElementById('timer-box').classList.remove('timer-low');

        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-seconds').innerText = timeLeft;

            if (timeLeft <= 10) {
                document.getElementById('timer-box').classList.add('timer-low');
            }

            if (timeLeft <= 0) {
                clearInterval(timer);
                if (userSelections[currentIdx] === undefined) {
                    userSelections[currentIdx] = -1; // -1 indicates Timed Out
                }
                handleNext();
            }
        }, 1000);
    }

    function loadQuestion() {
        const qData = activeQuestions[currentIdx];
        document.getElementById('q-counter').innerText = `Question ${currentIdx + 1} of ${activeQuestions.length}`;
        document.getElementById('question-text').innerText = qData.q;
        document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / activeQuestions.length) * 100}%`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.a.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-card';
            div.innerText = opt;
            div.onclick = () => {
                document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
                userSelections[currentIdx] = i;
                document.getElementById('next-btn').disabled = false;
            };
            container.appendChild(div);
        });

        document.getElementById('next-btn').disabled = true;
        startTimer();
    }

    function handleNext() {
        clearInterval(timer);

        // If they click next without selecting, or it timed out
        if (userSelections[currentIdx] === undefined) {
            userSelections[currentIdx] = -1;
        }

        if (userSelections[currentIdx] === activeQuestions[currentIdx].c) {
            score++;
        }

        currentIdx++;
        if (currentIdx < activeQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('results-ui').style.display = 'block';
        document.getElementById('score-display').innerText = `${score}/${activeQuestions.length}`;
        const msg = document.getElementById('result-message');

        // 80% passing threshold (Strictly Above 80%)
        const percentage = Math.round((score / activeQuestions.length) * 100);
        const passed = percentage >= 80;

        if (passed) {
            msg.innerText = "Congratulations! You passed.";
            msg.style.color = "var(--success)";
        } else {
            msg.innerText = `You did not pass. 80% (${passThreshold} correct) required. You will need to watch the training videos again before retrying.`;
            msg.style.color = "var(--danger)";
        }

        // SAVE TO BACKEND
        fetch('/ajax/submit-assessment/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({
                type: 'POSH',
                score: score,
                total: activeQuestions.length,
                passed: passed
            })
        }).then(res => res.json())
            .then(data => console.log("Result saved:", data))
            .catch(err => console.error("Error saving result:", err));
    }

    function generateReview() {
        document.getElementById('results-ui').style.display = 'none';
        document.getElementById('review-ui').style.display = 'block';
        const container = document.getElementById('review-container');
        container.innerHTML = '';

        activeQuestions.forEach((q, i) => {
            const userPick = userSelections[i];
            const isCorrect = userPick === q.c;
            const isTimedOut = userPick === -1;

            const item = document.createElement('div');
            item.className = `review-item ${isCorrect ? 'correct-border' : 'wrong-border'}`;

            let statusBadge = `<div class="status-badge bg-success-light">✓ Correct</div>`;
            if (isTimedOut) {
                statusBadge = `<div class="status-badge bg-warning-light">⌛ Timed Out</div>`;
            } else if (!isCorrect) {
                statusBadge = `<div class="status-badge bg-danger-light">✗ Incorrect</div>`;
            }

            item.innerHTML = `
                ${statusBadge}
                <h3 style="margin:0 0 10px 0;">${i + 1}. ${q.q}</h3>
                <p><strong>Your Answer:</strong> ${isTimedOut ? 'No Answer Given' : q.a[userPick]}</p>
                ${!isCorrect ? `<p style="color:var(--success)"><strong>Correct Answer:</strong> ${q.a[q.c]}</p>` : ''}
            `;
            container.appendChild(item);
        });
    }

    initQuiz();
</script>
{% endblock body %}
