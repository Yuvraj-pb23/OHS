{% load static %}
<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .header { background-color: #0f172a; padding: 30px; text-align: center; }
        .content { padding: 40px; background-color: #ffffff; }
        .footer { background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #f1f5f9; }
        .invoice-card { background-color: #f1f5f9; border-radius: 8px; padding: 20px; margin-top: 30px; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .invoice-table th { text-align: left; font-size: 12px; text-transform: uppercase; color: #64748b; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
        .invoice-table td { padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .total-row td { font-weight: bold; font-size: 16px; color: #0f172a; border-top: 2px solid #e2e8f0; border-bottom: none; padding-top: 15px; }
        .btn-action { display: inline-block; padding: 12px 24px; background-color: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
        .logo { height: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
                <div style="font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 20px;">
                    Open Hand Solutions
                </div>
            <div style="color: #6366f1; font-size: 10px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">Official Communication</div>
        </div>
        <div class="content">
            <div style="font-size: 14px; color: #0f172a;">
                {{ body_content|safe|linebreaks }}
            </div>

            <!-- Pricing summary removed as per request to hide costs in emails -->

            <!-- Portal links removed as per request -->
        </div>
        <div class="footer">
            <p><strong>Open Hand Private Limited</strong></p>
            <p>Empowering safety and compliance across institutions.</p>
            <p style="margin-top: 10px;">This is an automated email. Please do not reply directly to this message.</p>
        </div>
    </div>
</body>
</html>
