{% load static %}
<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .header { background-color: #0f172a; padding: 30px; text-align: center; }
        .content { padding: 40px; background-color: #ffffff; }
        .footer { background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #f1f5f9; }
        .logo { height: 50px; width: auto; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ logo_url }}" alt="Open Hand Solutions" class="logo">
            <div style="color: #6366f1; font-size: 10px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">Official Communication</div>
        </div>
        <div class="content">
            <div style="font-size: 14px; color: #0f172a;">
                {{ body_content|safe }}
            </div>
        </div>
        <div class="footer">
            <p><strong>Open Hand Private Limited</strong></p>
            <p>Empowering safety and compliance across institutions.</p>
            <p style="margin-top: 10px;">This is an automated email. Please do not reply directly to this message.</p>
        </div>
    </div>
</body>
</html>
