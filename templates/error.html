{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Page Not Found - OHPL</title>
    <link rel="shortcut icon" href="{% static 'img/favicon_final.ico' %}" type="image/x-icon">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle grid background identical to the main website */
        .background-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }
        
        /* Soft glowing orbs for a modern, advanced feel */
        .glow-orb-1, .glow-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.35;
            animation: float 10s ease-in-out infinite alternate;
        }
        
        .glow-orb-1 {
            width: 450px;
            height: 450px;
            background: rgba(98, 0, 234, 0.25); /* Purple hint from your buttons */
            top: -150px;
            left: -150px;
        }
        
        .glow-orb-2 {
            width: 550px;
            height: 550px;
            background: rgba(0, 180, 216, 0.2); /* Cyan/Blue hint from your logos */
            bottom: -200px;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(40px) scale(1.05); }
        }

        .error-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(15, 23, 42, 0.1); /* Slightly darker border */
            border-radius: 28px;
            padding: 60px 50px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.12), /* Darker, deeper shadow */
                0 10px 20px rgba(0, 0, 0, 0.06),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon-wrapper {
            width: 95px;
            height: 95px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 15px 30px rgba(98, 0, 234, 0.12),
                inset 0 2px 4px rgba(255, 255, 255, 1);
            border: 1px solid rgba(98, 0, 234, 0.1);
        }

        .error-icon {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #6200ea 0%, #4a00b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 15px 0;
            letter-spacing: -0.5px;
        }

        .error-message {
            font-size: 1.15rem;
            color: #475569;
            line-height: 1.6;
            margin: 0 0 40px 0;
            font-weight: 500;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #6200ea 0%, #4a00b0 100%);
            color: white;
            padding: 15px 36px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(98, 0, 234, 0.3);
            border: 2px solid transparent;
        }

        .btn-home:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(98, 0, 234, 0.4);
            background: linear-gradient(135deg, #4a00b0 0%, #31007a 100%);
        }
        
        .logo-container {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 20;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.5s;
        }
        
        .logo-container img {
            height: 50px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .logo-container {
                top: 25px;
                left: 25px;
            }
            .logo-container img {
                height: 40px;
            }
            .error-card {
                padding: 45px 35px;
            }
            .error-title {
                font-size: 2rem;
            }
            .error-message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="background-grid"></div>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    
    <!-- Top Left Logo (Falls back gracefully if not found) -->
    <div class="logo-container">
        <a href="{% url 'home' %}">
            <img src="{% static 'img/openhand_logo.png' %}" alt="OHPL Logo" onerror="this.style.display='none'">
        </a>
    </div>

    <!-- Error Card -->
    <div class="error-card">
        <div class="error-icon-wrapper">
            <i class="fa-solid fa-compass error-icon"></i>
        </div>
        <h1 class="error-title">Lost your way?</h1>
        <p class="error-message">
            We couldn't find the page you're looking for. It might have been moved, deleted, or perhaps the link is broken. Let's get you back on track.
        </p>
        <a href="{% url 'home' %}" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Homepage
        </a>
    </div>

</body>
</html>
