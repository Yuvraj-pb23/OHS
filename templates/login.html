{% extends 'base.html' %}
{% block body %}

<style>
    body {
        padding-top: 0 !important;
        background-image:
            linear-gradient(to right, rgba(15, 23, 42, 0.018) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(15, 23, 42, 0.018) 1px, transparent 1px),
            radial-gradient(circle at 10% 20%, #f0f9ff 0%, #eef2ff 40%, #e0f2fe 70%, #fffbeb 100%) !important;
        background-size: 40px 40px, 40px 40px, 100% 100% !important;
        position: relative;
        z-index: 1;
    }

    /* Ambient Glow Blobs */
    .ambient-glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.25;
        pointer-events: none;
        z-index: 0;
        animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .glow-blue {
        top: 10%; left: 5%;
        width: 350px; height: 350px;
        background: radial-gradient(circle, #0d6efd 0%, transparent 70%);
    }
    .glow-gold {
        bottom: 10%; right: 5%;
        width: 400px; height: 400px;
        background: radial-gradient(circle, #ffb400 0%, transparent 70%);
        animation-delay: -4s;
    }
    @keyframes pulseGlow {
        0%   { transform: scale(1) translate(0, 0); opacity: 0.2; }
        100% { transform: scale(1.15) translate(20px, -20px); opacity: 0.35; }
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 20px 40px;
        position: relative;
        z-index: 2;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 48px 44px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255,255,255,0.7);
        border: 1px solid rgba(255, 255, 255, 0.5);
        width: 100%;
        max-width: 420px;
        text-align: center;
    }

    .login-card h2 {
        color: #0f172a;
        margin-bottom: 28px;
        font-weight: 800;
        font-size: 2rem;
        letter-spacing: -0.5px;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #475569;
        font-size: 0.88rem;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid rgba(15, 23, 42, 0.12);
        border-radius: 10px;
        font-size: 1rem;
        background: rgba(255,255,255,0.75);
        color: #0f172a;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-control:focus {
        border-color: #0d6efd;
        outline: none;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        background: rgba(255,255,255,0.95);
    }

    .btn-login {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #0d6efd 0%, #00d2ff 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        letter-spacing: 0.3px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(13, 110, 253, 0.4);
    }
</style>

<!-- Ambient Glow Blobs -->
<div class="ambient-glow glow-blue"></div>
<div class="ambient-glow glow-gold"></div>

<div class="login-container">
    <div class="login-card">
        <h2>Welcome Back</h2>
        
        <!-- Error Message Handling -->
        {% if error_message %}
            <div style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #ef9a9a;">
                {{ error_message }}
            </div>
        {% elif form.errors %}
            <div style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #ef9a9a;">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" class="form-control" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="passwordInput" class="form-control" required placeholder="Enter your password" style="padding-right: 45px;">
                    <button type="button" id="togglePasswordBtn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #0d6efd; outline: none; padding: 0;">
                        <i class="fas fa-eye" id="passwordEyeIcon" style="font-size: 1.1rem;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
            
            <!-- Hidden field to redirect back to where they came from -->
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <p style="margin-top: 20px; font-size: 0.9rem; color: #64748b;">
            Don't have a subscription? <a href="{% url 'tutorial' %}" style="color: #0d6efd; font-weight: 600;">Get one here</a>
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('passwordInput');
        const passwordEyeIcon = document.getElementById('passwordEyeIcon');

        if (togglePasswordBtn && passwordInput && passwordEyeIcon) {
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye / eye-slash icon
                if (type === 'password') {
                    passwordEyeIcon.classList.remove('fa-eye-slash');
                    passwordEyeIcon.classList.add('fa-eye');
                } else {
                    passwordEyeIcon.classList.remove('fa-eye');
                    passwordEyeIcon.classList.add('fa-eye-slash');
                }
            });
        }
    });
</script>
{% endblock body %}
